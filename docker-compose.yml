version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: georef-db
    environment:
      POSTGRES_USER: georef_user
      POSTGRES_PASSWORD: georef_password
      POSTGRES_DB: georef_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U georef_user -d georef_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: georef-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=georef_user
      - DB_PASSWORD=georef_password
      - DB_NAME=georef_db
      - SERVER_PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres-data:
